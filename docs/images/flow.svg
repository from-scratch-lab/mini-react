<rect x="519" y="44" width="38" height="38" rx="11" fill="#ffffff"/><text x="538" y="70" font-size="18" font-weight="800" text-anchor="middle" fill="#1f4fd1">3</text>
<text x="519" y="120" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="-0.4">diff 안쪽: LIS</text>
<text x="519" y="150" font-size="14" font-weight="600" fill="#e4ecff">순서가 맞는 행은 그대로</text>
