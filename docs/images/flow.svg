<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-label="네 장면: 1 마운트(CREATE 1개), 2 클릭 후 업데이트(고칠 곳 2개만 patch), 3 LIS(1개만 옮기기), 4 언마운트(정리 함수, REMOVE 1개)" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
