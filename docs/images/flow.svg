<text x="280.5" y="120" font-size="19" font-weight="800" fill="#0b1a3a" letter-spacing="-0.4">클릭 → 업데이트</text>
<text x="280.5" y="150" font-size="14" font-weight="600" fill="#4e5968">setState → 새 가상 트리</text>
