<rect x="608" y="116" width="306" height="102" rx="14" fill="#ffffff" stroke="#e5e9f2" filter="url(#sh2)"/>
<rect x="626" y="134" width="36" height="36" rx="8" fill="url(#gNavy)"/><text x="644" y="158" font-size="15" font-weight="800" text-anchor="middle" fill="#ffffff">01</text>
<text x="676" y="156" font-size="15" font-weight="800" fill="#111827">diff에서 조금 더 쓴다</text>
<text x="676" y="180" font-size="12.2" fill="#6b7280">LIS 계산 때문에 diff 시간 중앙값</text>
<text x="676" y="199" font-size="12.2" fill="#6b7280">+2~6% (구간이 겹쳐 단정은 안 함)</text>
<rect x="608" y="232" width="306" height="102" rx="14" fill="#ffffff" stroke="#e5e9f2" filter="url(#sh2)"/>
<rect x="626" y="250" width="36" height="36" rx="8" fill="url(#gNavy)"/><text x="644" y="274" font-size="15" font-weight="800" text-anchor="middle" fill="#ffffff">02</text>
<text x="676" y="272" font-size="15" font-weight="800" fill="#111827">commit에서 크게 아낀다</text>
<text x="676" y="296" font-size="12.2" fill="#6b7280">1% 이동: 0.645 → 0.015ms</text>
<text x="676" y="315" font-size="12.2" fill="#6b7280">옮긴 노드 869 → 10</text>
<rect x="608" y="348" width="306" height="102" rx="14" fill="#ffffff" stroke="#e5e9f2" filter="url(#sh2)"/>
<rect x="626" y="366" width="36" height="36" rx="8" fill="url(#gNavy)"/><text x="644" y="390" font-size="15" font-weight="800" text-anchor="middle" fill="#ffffff">03</text>
<text x="676" y="388" font-size="15" font-weight="800" fill="#111827">많이 섞일수록 이득이 준다</text>
<text x="676" y="412" font-size="12.2" fill="#6b7280">합계 0.59× (1%) → 0.99× (100%)</text>
<text x="676" y="431" font-size="12.2" fill="#6b7280">거의 다 섞이면 옮길 노드가 비슷</text>
</svg>
